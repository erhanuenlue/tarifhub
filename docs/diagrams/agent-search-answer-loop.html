<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One question in the agent loop</title>
  <!-- Drawn with the diagram-design skill 2.6.170 (commit d7b0176, Sequence type, fit size, font source system)
       from Scenario 5 of docs/arc42/06-runtime-view.md and checked against tools/commentary_rag/run_question.py,
       evidence_agent.py and evidence_search.py (ADR-026). Sized for the A4 report width of 170 mm: the viewBox is
       560 wide, so the smallest text (9) prints at 7.7 pt and the node names (12) at 10.3 pt. The search is the
       agent's own call (evidence_search runs in process, in memory, with no network), so it is a self-message. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 560px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · ADR-026 · Diagram Design</p>
    <h1>One question in the agent loop</h1>

      <title id="agent-search-answer-loop-title">One question in the agent loop</title>
      <desc id="agent-search-answer-loop-desc">Sequence diagram of one question in the evidence-seeking agent (ADR-026): the runner checks its input, ranks a fresh hybrid top 5 and calls the agent once; the books admit three calls at the input cap; each of at most three calls is token-counted, checked against the input cap and the spending limit, reserved, sent once to the Messages API and settled, with the deadline checked before each count and send and after each call and search; a tool_use while tool_choice is auto runs one search in the agent's own code, within two searches and ten passages; the answer's schema and citations are checked and the outcome goes back to the runner, which writes its outputs.</desc>
