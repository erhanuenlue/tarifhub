<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-search-answer-loop-title agent-search-answer-loop-desc" id="agent-search-answer-loop-root">
      <title id="agent-search-answer-loop-title">One question in the agent loop</title>
      <desc id="agent-search-answer-loop-desc">Sequence diagram of one question in the evidence-seeking agent (ADR-026): the runner checks its input, ranks a fresh hybrid top 5 and calls the agent once; the books admit three calls at the input cap; each of at most three calls is token-counted, checked against the input cap and the spending limit, reserved, sent once to the Messages API and settled, with the deadline checked before each count and send and after each call and search; one valid search_commentary call while tool_choice is auto is dispatched once to the search tool in the agent's own code (a call above its reservation stops before dispatch), and the tool ranks within two searches and ten passages or returns refused arguments as an error result; the answer's schema and citations are checked and the outcome goes back to the runner, which writes its outputs when a call was reserved or its reservation is uncertain.</desc>
      <defs>
      <style>#agent-search-answer-loop-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #agent-search-answer-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-search-answer-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#agent-search-answer-loop-root .diagram-container { overflow-x: visible; }
}</style>
